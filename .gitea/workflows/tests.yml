# Runs the bats suite on every pull request and on every push to one.
# `pull_request` defaults to opened, reopened and synchronize, and
# synchronize is the push-to-an-open-PR event, so both are covered without
# listing types.
#
# Two jobs, split by what a red one tells you: `tests` checks the branch,
# `runner-env` checks the machine it was handed. Each says why at its own
# definition.
name: tests

# `pull_request`, so the workflow is read from the head of the pull request
# and a change to this file is tested by the pull request that makes it.
#
# This used to be `pull_request_target`, on the reasoning that reading the
# workflow from the base branch meant a branch could not redirect its own
# suite. It bought close to nothing: the base is whichever branch the pull
# request names, and any pushed branch can be one, so a branch carrying its
# own copy of this file could still choose what ran - with nothing in the
# pull request's diff to show it, because that diff is head against base.
# What it did cost was that a pull request could never change its own CI. See
# https://gitbox.branderson.io/dejima/dejima/issues/384, and dejima/dejima#440
# for the same move there.
#
# So this file is not a boundary, and was not one before. A branch decides
# what runs here and on which label. What decides what that can reach is
# which runners the repository can reach at all - see the README's "Register
# scope is the boundary; the label is not".
on:
  pull_request:

# No `concurrency:` block. Gitea does not implement one - so writing it here
# would only claim a cancellation that never happens. On a single-capacity
# runner, expect a backlog rather than a supersede, and cancel a stale run by
# hand if it is in the way.

jobs:
  tests:
    # The CONFINED tier, not the privileged one, and the difference is the
    # point rather than a detail.
    #
    # Everything this repository tests is bats over shell scripts, YAML and
    # markdown. Nothing here needs a Docker socket or the host's network
    # namespace, so asking for a runner that grants both would be taking a
    # privilege for no reason - in a repository whose entire subject is not
    # doing that.
    #
    # The confined tier resolves only what .dejima/allowed-domains permits,
    # which is deb.debian.org, which is where bats comes from. If a future test
    # needs something else, the honest fix is to declare it there rather than
    # to move this job to a runner that grants everything.
    #
    # If no runner carries this label, this job queues. That is the intended
    # failure, and a better one than a green run on a host that grants more
    # than the job asked for.
    runs-on: dejima-confined
    container:
      # Debian bookworm plus a node binary - node is what actions/checkout
      # needs to run at all, and apt-get is what everything below needs.
      image: node:20-bookworm
    steps:
      # Before apt, because apt's failure for this says "Unable to locate
      # package bats" and nothing about why.
      #
      # This tier DOES have an egress allowlist in front of it, so a name that
      # fails here has one more possible cause than it would on the privileged
      # tier: this repository's own .dejima/allowed-domains. The diagnosis
      # below names that first, because it is the one thing a change in this
      # repository can break.
      #
      # Retried rather than decided on one attempt: a resolver can be a moment
      # behind a container's start, and apt itself retries, so failing a whole
      # job on a single lookup would be stricter than the step it protects.
      # Six attempts over ~15s, then a diagnosis.
      #
      # Uses only what the image already has: getent is libc.
      - name: Check this host can resolve before installing anything
        run: |
          for attempt in 1 2 3 4 5 6; do
            if getent hosts deb.debian.org >/dev/null 2>&1; then
              [ "$attempt" -eq 1 ] || echo "resolved on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "deb.debian.org did not resolve after 6 attempts, so this job" >&2
          echo "cannot install anything." >&2
          echo "" >&2
          echo "This job's resolver:" >&2
          sed -n 's/^nameserver/  nameserver/p' /etc/resolv.conf >&2
          echo "" >&2
          echo "This is the confined tier, so check in this order:" >&2
          echo "" >&2
          echo "1. .dejima/allowed-domains in THIS repository, on main." >&2
          echo "   The runner reads it from main, not from this branch, so a" >&2
          echo "   domain added on the branch under test is not yet in force." >&2
          echo "   That is deliberate: a branch cannot grant itself a" >&2
          echo "   destination." >&2
          echo "" >&2
          echo "2. On the runner host:" >&2
          echo "     sudo dejima-ci-allowlist show   - what is actually served" >&2
          echo "     cat /etc/resolv.conf            - the VM's own resolver" >&2
          echo "" >&2
          echo "If the VM cannot resolve either, the node firewall's udp/53 and" >&2
          echo "tcp/53 pinholes are the usual cause - they must name the VM's" >&2
          echo "NAMESERVER, not its gateway, and must sit ABOVE the LAN DROP" >&2
          echo "rules. See proxmox/README.md section 3." >&2
          exit 1

      - name: Install test dependencies
        run: |
          apt-get update
          # python3-yaml, not a YAML parser fetched at test time: two tests
          # assert that the templates and the rendered files parse, and they
          # skip rather than fail when no parser is present. A skip reads as a
          # pass in the run summary, so the parser is installed here to make
          # sure those two actually run.
          apt-get install -y --no-install-recommends bats python3 python3-yaml ca-certificates

      - uses: actions/checkout@v4

      # As an ordinary user, not root. Kept from the sister repository because
      # the reasoning outlives the test that prompted it: `[ -r ]` is access(2)
      # with R_OK, which always succeeds for a process holding
      # CAP_DAC_OVERRIDE, so any test distinguishing unreadable from missing
      # passes vacuously as root. Jobs run as root by default, so this is a
      # standing hazard rather than a one-off, and the test fails on the
      # privilege of whoever
      # ran it rather than on anything the program does.
      #
      # The test skips itself under root rather than failing, so this is what
      # makes it actually run rather than what stops it breaking.
      #
      # Nothing else in the suite needs either privilege: it stubs curl,
      # dnsmasq and docker, and writes only into its own temp directories.
      # `node` is uid 1000 in this image and needs to own the checkout, which
      # actions/checkout leaves owned by root.
      - run: |
          chown -R node:node .
          su node -c "bats test/"


  runner-env:
    # Asserts on the RUNNER rather than on the change, which is why it is a
    # separate job: a red `runner-env` should say "the machine is wrong", and a
    # red `tests` should say "the branch is wrong". One job reporting both
    # makes every failure ambiguous.
    #
    # Same label as the job above, deliberately. The point is not to reach a
    # different runner, it is to check that the runner this repository asked
    # for is the one it got. `runs-on:` is a request, and nothing in a job's
    # log says whether the Docker socket was mounted into it.
    runs-on: dejima-confined
    container:
      image: node:20-bookworm
    steps:
      # These assert on the RUNNER, and come from the branch like everything
      # else here. A branch that weakens them does it in its own diff.
      - uses: actions/checkout@v4

      - run: |
          apt-get update
          apt-get install -y --no-install-recommends bats python3 ca-certificates

      - run: bats test/runner-env.bats
        env:
          # Declared, not detected. Landing on the wrong runner should fail
          # rather than quietly select a different set of assertions.
          DEJIMA_CI_TIER: confined
